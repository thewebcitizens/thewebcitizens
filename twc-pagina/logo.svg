<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo exterior -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="url(#gradCyan)" stroke-width="6"/>
  
  <!-- Globo terráqueo -->
  <ellipse cx="150" cy="150" rx="90" ry="90" fill="none" stroke="url(#gradCyan)" stroke-width="5"/>
  <ellipse cx="150" cy="150" rx="90" ry="45" fill="none" stroke="url(#gradCyan)" stroke-width="4"/>
  <line x1="60" y1="150" x2="240" y2="150" stroke="url(#gradCyan)" stroke-width="4"/>
  <line x1="150" y1="60" x2="150" y2="240" stroke="url(#gradCyan)" stroke-width="4"/>
  
  <!-- Letra C grande -->
  <path d="M 180 150 A 80 80 0 0 1 100 230 A 80 80 0 0 1 100 70 A 80 80 0 0 1 180 150" 
        fill="none" stroke="url(#gradCyan)" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Nodos tecnológicos -->
  <circle cx="150" cy="60" r="8" fill="#00d4ff"/>
  <circle cx="240" cy="150" r="8" fill="#00d4ff"/>
  <circle cx="150" cy="240" r="8" fill="#00d4ff"/>
  <circle cx="60" cy="150" r="8" fill="#00d4ff"/>
  <circle cx="105" cy="105" r="6" fill="#0080ff"/>
  <circle cx="195" cy="105" r="6" fill="#0080ff"/>
  <circle cx="195" cy="195" r="6" fill="#0080ff"/>
  <circle cx="105" cy="195" r="6" fill="#0080ff"/>
  
  <!-- THE WEB CITIZENS -->
  <text x="320" y="140" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#gradCyan)" letter-spacing="2">THE WEB</text>
  <text x="320" y="210" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#gradCyan)" letter-spacing="2">CITIZENS</text>
  
  <!-- TWO WEBSITE CREATORS -->
  <text x="320" y="250" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#ffffff" letter-spacing="4">TWO WEBSITE CREATORS</text>
</svg>
